match_schemas:
  description: >
    Analyze data structures from different sources and identify their relationships and mappings.

    Query: {query}
    Database Data: {db_data}
    Web Data: {web_data}  
    Document Data: {doc_data}
  expected_output: >
    A detailed data structure mapping analysis, including:
    1. Entity mappings
    2. Attribute mappings
    3. Relationship types
    4. Data transformation suggestions
