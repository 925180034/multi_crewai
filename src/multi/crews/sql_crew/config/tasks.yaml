search_database:
  description: >
    Search for database information based on the query and plan.
    Query: {query}
    Plan: {plan}
  expected_output: >
    Detailed information about the database structure, relationships, and data.
  agent: database_agent  # Added this line to explicitly specify the agent used

search_web:
  description: >
    Search the web for relevant information based on the query and plan.
    Query: {query}
    Plan: {plan}
  expected_output: >
    A summary of web information related to the query.
  agent: web_agent  # Added this line to explicitly specify the agent used

search_documents:
  description: >
    Search for query-related information in documents.
    Query: {query}
    Plan: {plan}
  expected_output: >
    Structured information extracted from the documents.
  agent: document_agent  # Added this line to explicitly specify the agent used
